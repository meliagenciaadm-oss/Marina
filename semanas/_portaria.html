<style>
/* Caixinha de entrada: cobre a página até a pessoa deixar nome e e-mail */
body.trancado{overflow:hidden}
body.trancado .wrap{filter:blur(6px);pointer-events:none;user-select:none}
.portaria{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.portaria[hidden]{display:none}
.porta{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:grid;gap:14px;box-shadow:0 24px 60px -24px rgba(20,50,30,.55);text-align:center}
.porta img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:top;margin:0 auto;border:3px solid var(--mint)}
.porta h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.05;margin:0;color:var(--forest);text-wrap:balance}
.porta h2 em{font-style:normal;color:var(--leaf)}
.porta p{margin:0;font-size:14px;color:var(--muted)}
.porta form{display:grid;gap:10px;text-align:left}
.porta label{font-size:13px;font-weight:600;display:grid;gap:4px}
.porta input[type=text],.porta input[type=email]{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px}
.porta .aceite{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--muted);font-size:12.5px}
.porta .aceite input{margin-top:2px;accent-color:var(--leaf)}
.porta button{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:999px;padding:12px;background:var(--band);color:var(--band-ink);cursor:pointer;margin-top:4px}
.porta button:disabled{opacity:.6;cursor:wait}
.porta .erro{color:var(--gold);font-size:13px;min-height:1em}
.porta .bot{position:absolute;left:-9999px}
</style>

<div class="portaria" id="portaria" hidden>
  <div class="porta" role="dialog" aria-modal="true" aria-labelledby="porta-titulo">
    <img src="/assets/foto-perfil.jpg" alt="">
    <h2 id="porta-titulo">Bem vinda ao meu <em>banco de ideias!</em></h2>
    <p>Coloca teu nome e e-mail pra entrar :)</p>
    <form name="acessos" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="form-acesso">
      <input type="hidden" name="form-name" value="acessos">
      <input type="hidden" name="semana" value="{{SEMANA}}">
      <label class="bot">Não preencha <input name="bot-field"></label>
      <label for="ac-nome">Seu nome<input id="ac-nome" name="nome" type="text" autocomplete="name" required></label>
      <label for="ac-email">Seu e-mail<input id="ac-email" name="email" type="email" autocomplete="email" required></label>
      <label class="aceite" for="ac-aceite"><input id="ac-aceite" name="aceite" type="checkbox" value="sim" required> Aceito receber conteúdos por e-mail</label>
      <button type="submit" id="ac-entrar">Entrar</button>
      <div class="erro" id="ac-erro" role="alert"></div>
    </form>
  </div>
</div>

<script>
(() => {
  const CHAVE = "banco-ideias-acesso", SEMANA = "{{SEMANA}}";
  const portaria = document.getElementById("portaria"), form = document.getElementById("form-acesso");
  const ler = () => { try { return JSON.parse(localStorage.getItem(CHAVE) || "null"); } catch (e) { return null; } };
  const gravar = v => { try { localStorage.setItem(CHAVE, JSON.stringify(v)); } catch (e) {} };
  const enviar = dados => fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ "form-name": "acessos", semana: SEMANA, ...dados }).toString() });
  const abrir = () => { document.body.classList.remove("trancado"); portaria.hidden = true; };

  const salvo = ler();
  if (salvo && salvo.email) {
    abrir();
    // Já entrou antes neste aparelho: registra o acesso desta semana sem pedir de novo.
    if (!(salvo.semanas || []).includes(SEMANA)) {
      enviar({ nome: salvo.nome, email: salvo.email, aceite: "sim" }).then(r => {
        if (r.ok) gravar({ ...salvo, semanas: [...(salvo.semanas || []), SEMANA] });
      }).catch(() => {});
    }
  } else {
    document.body.classList.add("trancado");
    portaria.hidden = false;
    document.getElementById("ac-nome").focus();
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const btn = document.getElementById("ac-entrar"), erro = document.getElementById("ac-erro");
    const nome = form.nome.value.trim(), email = form.email.value.trim();
    btn.disabled = true; btn.textContent = "Entrando…"; erro.textContent = "";
    enviar({ nome, email, aceite: "sim", "bot-field": form["bot-field"].value })
      .then(r => { if (!r.ok) throw new Error(); gravar({ nome, email, semanas: [SEMANA] }); abrir(); })
      .catch(() => { erro.textContent = "Não deu pra entrar agora. Confere a internet e tenta de novo."; })
      .finally(() => { btn.disabled = false; btn.textContent = "Entrar"; });
  });
})();
</script>
