<title>Meli Cursos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* layout: header fixo + faixa verde de boas-vindas + vitrine em grade; curso e aula em duas colunas que empilham no celular */
:root{
  --bg:#F3EFE3; --surface:#FFFDF7; --ink:#2B3626; --muted:#5E6B55; --line:rgba(43,54,38,.12);
  --brand:#36432F; --brand-ink:#F3EFE3; --sun:#F6EF8D; --sun-ink:#2B3626; --ok:#4F7A3A; --chat:#ffffff; --chat-ink:#1c1c1e; --sel:rgba(10,132,255,.18); --blue:#0A84FF;
  --display:'Poppins',ui-sans-serif,system-ui,sans-serif; --body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C2419; --surface:#263021; --ink:#F1EDE1; --muted:#B4BEA8; --line:rgba(241,237,225,.12);
  --brand:#36432F; --brand-ink:#F3EFE3; --sun:#F6EF8D; --sun-ink:#2B3626; --ok:#A9CF8C; --chat:#2F3A2A; --chat-ink:#F1EDE1; --sel:rgba(10,132,255,.32); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C2419; --surface:#263021; --ink:#F1EDE1; --muted:#B4BEA8; --line:rgba(241,237,225,.12);
  --brand:#36432F; --brand-ink:#F3EFE3; --sun:#F6EF8D; --sun-ink:#2B3626; --ok:#A9CF8C; --chat:#2F3A2A; --chat-ink:#F1EDE1; --sel:rgba(10,132,255,.32); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.98;margin:0;text-wrap:balance;text-transform:lowercase}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.05em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo span{background:var(--sun);color:var(--sun-ink);font-size:13px;letter-spacing:0;padding:3px 10px;border-radius:30px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:30px;opacity:.85}
.nav a[aria-current="page"]{background:rgba(255,255,255,.12);opacity:1}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.me img{width:38px;height:38px;border-radius:50%;border:2px solid var(--sun)}
@media (max-width:640px){.nav{display:none}.me span{display:none}}

.demo{background:var(--sun);color:var(--sun-ink);font-size:13px;font-weight:600}
.demo .wrap{padding-block:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* chat bubble (assinatura visual) */
.chat{display:inline-flex;align-items:center;gap:12px;background:var(--chat);color:var(--chat-ink);border-radius:40px;padding:10px 10px 10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.16);max-width:100%}
.chat .plus{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(127,127,127,.15);display:grid;place-items:center;font-size:20px}
.chat .t{min-width:0;font-size:16px;line-height:1.35}
.chat .t mark{background:var(--sel);color:inherit;padding:1px 2px;box-shadow:-2px 0 0 var(--blue),2px 0 0 var(--blue)}
.chat .send{flex:none;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}

/* hero */
.hero{background:var(--brand);color:var(--brand-ink);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.3fr .9fr;gap:24px;align-items:end;padding-block:40px 0}
.hero h1{font-size:clamp(44px,7vw,84px);color:var(--sun)}
.hero p{margin:14px 0 22px;max-width:44ch;opacity:.9}
.hero .copy{padding-bottom:40px;min-width:0}
.hero .art{position:relative;align-self:end;justify-self:end;width:min(360px,100%)}
.hero .art img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px 28px 0 0}
.spark{position:absolute;font-size:28px}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero .art{justify-self:center;width:min(300px,80%)}.hero .copy{padding-bottom:8px}}

main{padding-block:36px 64px;display:flex;flex-direction:column;gap:40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:clamp(28px,4vw,38px)}
.sec-h small{color:var(--muted);font-size:14px}

/* continue */
.cont{display:grid;grid-template-columns:200px 1fr auto;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cont .mini{aspect-ratio:16/10;border-radius:14px;overflow:hidden}
.cont .mini .em2{display:none}
.cont .mini .ct{font-size:24px}
.cont h3{font-size:22px}
.cont p{margin:6px 0 10px;color:var(--muted);font-size:14px}
@media (max-width:640px){.cont{grid-template-columns:1fr}.cont .mini{display:none}}

/* course cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:22px}
.card p{margin:0;color:var(--muted);font-size:14px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:500}
.card .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.lock{font-size:12px;font-weight:700;background:var(--line);padding:4px 10px;border-radius:20px;align-self:flex-start}

/* generated covers */
.cover{position:relative;aspect-ratio:16/10;display:flex;align-items:flex-end;padding:16px;overflow:hidden}
.cover .ct{font-family:var(--display);font-weight:800;letter-spacing:-.05em;line-height:.9;font-size:30px;text-transform:lowercase;position:relative;z-index:1}
.cover .em{position:absolute;right:14px;top:10px;font-size:42px;transform:rotate(8deg)}
.cover .em2{position:absolute;right:70px;top:46px;font-size:22px}
.c1{background:radial-gradient(120% 90% at 90% 0%,#4b5b40,#2B3626);color:var(--sun)}
.c2{background:var(--sun);color:#2B3626}
.c3{background:radial-gradient(120% 90% at 10% 0%,#e8d6b4,#cdb88f);color:#2B3626}
.c4{background:#C9D8B4;color:#2B3626}
.cover.big{aspect-ratio:auto;min-height:220px;border-radius:var(--r)}
.cover.big .ct{font-size:clamp(36px,5vw,54px)}

.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:8px}
.pct{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:40px;padding:12px 22px;font-weight:700;font-size:15px;text-decoration:none;background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.done{background:var(--ok);color:var(--bg)}

/* course page */
.crumb{font-size:14px;color:var(--muted);text-decoration:none;font-weight:600}
.course{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.course > *{min-width:0}
.course .intro{display:flex;flex-direction:column;gap:16px}
.course .intro p{margin:0;max-width:62ch}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.side li::before{content:"✓ ";color:var(--ok);font-weight:700}
@media (max-width:860px){.course{grid-template-columns:1fr}.side{position:static}}

.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mod + .mod{margin-top:12px}
.mod summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:center}
.mod summary::-webkit-details-marker{display:none}
.mod summary .n{flex:none;font-family:var(--display);font-weight:800;background:var(--sun);color:var(--sun-ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.mod summary b{font-weight:700}
.mod summary small{margin-left:auto;color:var(--muted);white-space:nowrap}
.mod ol{list-style:none;margin:0;padding:0 8px 8px}
.les{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;text-decoration:none}
.les:hover,.les[aria-current="true"]{background:var(--line)}
.les .chk{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.les.is-done .chk{background:var(--ok);color:var(--bg);box-shadow:none}
.les span{min-width:0}
.les small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

/* lesson page */
.lesson{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.lesson > *{min-width:0}
.player{aspect-ratio:16/9;max-width:100%;border-radius:var(--r);background:radial-gradient(90% 90% at 80% 10%,rgba(242,201,122,.25),transparent 60%),#2B3626;color:#F3EFE3;display:grid;place-items:center;text-align:center;padding:16px}
.player .play{width:76px;height:76px;border-radius:50%;background:var(--sun);color:#2B3626;display:grid;place-items:center;font-size:30px;margin:0 auto 12px}
.player small{opacity:.8}
.lesson h1{font-size:clamp(30px,4vw,44px);margin:20px 0 8px}
.lesson .desc{color:var(--muted);max-width:62ch}
.mat{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.mat div{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:860px){.lesson{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

const lessonsOf = c => c.mods.flatMap((m,mi)=>m.ls.map((l,li)=>({key:`${c.id}-${mi+1}-${li+1}`,t:l[0],dur:l[1],mi,li})));
const mins = c => Math.round(lessonsOf(c).reduce((s,l)=>{const [m,ss]=l.dur.split(':').map(Number);return s+(m||0)+(ss||0)/60},0));

// progresso guardado só neste navegador
const KEY="meli-cursos-feitas";
let done = new Set();
try{ const raw=localStorage.getItem(KEY); done = new Set(raw?JSON.parse(raw):["instagram-do-zero-1-1","instagram-do-zero-1-2","instagram-do-zero-1-3","instagram-do-zero-2-1"]); }catch(e){ done=new Set(["instagram-do-zero-1-1","instagram-do-zero-1-2","instagram-do-zero-1-3","instagram-do-zero-2-1"]); }
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};
const prog = c => { const ls=lessonsOf(c); return ls.length? Math.round(ls.filter(l=>done.has(l.key)).length*100/ls.length):0; };
const nextOf = c => lessonsOf(c).find(l=>!done.has(l.key)) || lessonsOf(c)[0];

const esc = s => String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const cover = (c,big) => `<div class="cover ${c.cv}${big?' big':''}"><span class="em" aria-hidden="true">${c.em}</span><span class="em2" aria-hidden="true">${c.em2}</span><div class="ct">${esc(c.t)}</div></div>`;
const chat = txt => `<div class="chat"><span class="plus" aria-hidden="true">+</span><span class="t"><mark>${txt}</mark></span><span class="send" aria-hidden="true">↑</span></div>`;
const bar = p => `<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;

function card(c){
  const p=prog(c), n=lessonsOf(c).length;
  return `<a class="card" href="#curso-${c.id}">${cover(c)}<div class="body">
    <h3>${esc(c.t)}</h3><p>${esc(c.d)}</p>
    <div class="meta"><span>${c.soon?'':n+' aulas'}</span><span>${c.soon?'':'~'+mins(c)+' min'}</span>${c.soon?'':`<span>${esc(c.lvl)}</span>`}</div>
    <div class="foot">${c.soon?'<span class="lock">🔒 em breve</span>':`${bar(p)}<span class="pct">${p? p+'% concluído':'não iniciado'}</span>`}</div>
  </div></a>`;
}

function viewHome(all){
  const started = COURSES.filter(c=>!c.soon && prog(c)>0 && prog(c)<100);
  const cur = started[0];
  let html = all ? '' : `<section class="hero"><div class="wrap">
      <div class="copy"><h1>bem-vinda à sua área de cursos</h1>
      <p>Aulas curtas e práticas da Meli Agência pra você criar conteúdo com estratégia e transformar o seu perfil em negócio.</p>
      ${chat('o que você vai aprender hoje? 👀✨')}</div>
      <div class="art"><img src="${DOLLFULL}" alt="Ilustração da mascote da Meli no notebook"><span class="spark" style="left:-14px;top:30px" aria-hidden="true">⭐</span><span class="spark" style="right:8px;top:-6px" aria-hidden="true">🌟</span></div>
    </div></section>`;
  html += `<main class="wrap">`;
  if(cur && !all){
    const nx=nextOf(cur);
    html += `<section><div class="sec-h"><h2>continue de onde parou</h2></div>
      <div class="cont"><div class="mini">${cover(cur)}</div>
      <div><h3>${esc(cur.t)}</h3><p>Próxima aula: ${esc(nx.t)}</p>${bar(prog(cur))}</div>
      <a class="btn" href="#aula-${nx.key}">▶ continuar</a></div></section>`;
  }
  html += `<section><div class="sec-h"><h2>${all?'todos os cursos':'seus cursos'}</h2><small>${COURSES.filter(c=>!c.soon).length} disponíveis</small></div>
    <div class="grid">${COURSES.map(card).join('')}</div></section></main>`;
  return html;
}

function viewCourse(c){
  const p=prog(c), nx=nextOf(c);
  return `<main class="wrap"><a class="crumb" href="#inicio">← voltar aos cursos</a>
  <div class="course">
    <div class="intro">${cover(c,true)}
      <h1 style="font-size:clamp(34px,5vw,52px)">${esc(c.t)}</h1>
      <p>${esc(c.d)}</p>
      <div class="meta"><span>${lessonsOf(c).length} aulas</span><span>~${mins(c)} min</span><span>${esc(c.lvl)}</span></div>
      <div>${c.mods.map((m,mi)=>`<details class="mod" ${mi===nx.mi?'open':''}><summary><span class="n">${mi+1}</span><b>${esc(m.t)}</b><small>${m.ls.length} aulas</small></summary>
        <ol>${m.ls.map((l,li)=>{const k=`${c.id}-${mi+1}-${li+1}`;const d=done.has(k);return `<li><a class="les${d?' is-done':''}" href="${c.soon?'#curso-'+c.id:'#aula-'+k}"><span class="chk">${d?'✓':''}</span><span>${esc(l[0])}</span><small>${l[1]}</small></a></li>`}).join('')}</ol></details>`).join('')}</div>
    </div>
    <aside class="side">
      <h3 style="font-size:24px">${c.soon?'em breve':p===100?'curso concluído 🎉':p?'seu progresso':'pronta pra começar?'}</h3>
      ${c.soon?'<p style="margin:0;color:var(--muted)">Esse curso está em produção. Avisamos quando abrir.</p>':`${bar(p)}<span class="pct">${p}% concluído</span>

      <b style="font-size:14px">o que você vai aprender</b>
      <ul>${c.learn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    </aside>
  </div></main>`;
}

function viewLesson(c,key){
  const ls=lessonsOf(c), i=ls.findIndex(l=>l.key===key); if(i<0) return viewCourse(c);
  const l=ls[i], nx=ls[i+1], d=done.has(l.key);
  return `<main class="wrap"><a class="crumb" href="#curso-${c.id}">← ${esc(c.t)}</a>
  <div class="lesson">
    <div>
      <div class="player"><div><div class="play" aria-hidden="true">▶</div><b>vídeo da aula</b><br><small>Aqui entra o vídeo hospedado (Vimeo, YouTube não listado ou Panda Video).</small></div></div>

      <h1>${esc(l.t)}</h1>

      </div>

    <aside class="side"><h3 style="font-size:22px">${esc(c.t)}</h3>${bar(prog(c))}<span class="pct">${prog(c)}% concluído</span>
      <ol style="list-style:none;margin:0;padding:0">${ls.map(x=>`<li><a class="les${done.has(x.key)?' is-done':''}" href="#aula-${x.key}" aria-current="${x.key===key}"><span class="chk">${done.has(x.key)?'✓':''}</span><span>${esc(x.t)}</span><small>${x.dur}</small></a></li>`).join('')}</ol>

  </div></main>`;
}

const app=document.getElementById('app');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function render(){
  const h=(location.hash||'#inicio').slice(1);
  let html, nav='inicio';
  if(h==='cursos'){html=viewHome(true);nav='cursos'}
  else if(h.startsWith('curso-')){const c=COURSES.find(x=>x.id===h.slice(6));html=c?viewCourse(c):viewHome()}
  else if(h.startsWith('aula-')){const k=h.slice(5);const c=COURSES.find(x=>k.startsWith(x.id+'-'));html=c?viewLesson(c,k):viewHome()}
  else html=viewHome();
  app.innerHTML=html;
  document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===nav?'page':'false'));
  const b=document.getElementById('toggle-done');
  if(b) b.addEventListener('click',()=>{const k=h.slice(5);if(done.has(k)){done.delete(k);}else{done.add(k);toast('aula concluída ✨')}save();render();});
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();
</script>
